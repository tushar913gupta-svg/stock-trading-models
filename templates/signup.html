{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">

        <div class="text-center mb-4">
            <p class="qt-eyebrow text-secondary mb-1">RedSun</p>
            <h2 class="fw-semibold mb-1">Create account</h2>
            <p class="text-secondary small">Start building your AI-powered portfolio</p>
        </div>

        <div class="card bg-black border-secondary rounded-3 p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary small">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="johndoe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Email</label>
                    <input type="email" name="email" class="form-control bg-dark text-light border-secondary" placeholder="you@example.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
                </div>
                <button class="btn btn-success w-100">Create Account</button>
            </form>
        </div>

        <p class="text-center text-secondary small mt-3">
            Already have an account? <a href="/login" class="text-primary fw-semibold">Login →</a>
        </p>

    </div>
</div>

{% endblock %}
